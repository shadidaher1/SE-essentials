name: Dummy workflow

on:
  push:
    branches:
      - '**'
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Grab all the code
        uses: actions/checkout@v5
       
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Transpile TypeScript
        run: npm run build
      - name: Cache the built files
        uses: actions/cache@v5
        with:
          path: build
          key: ${{ runner.os }}-build-${{ github.sha }}
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Grab all the code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Cache the test results
        uses: actions/cache@v5
        with:
          path: coverage
          key: ${{ runner.os }}-test-${{ github.sha }}
  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Grab all the code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run linter
        run: npm run lint

  release:
    runs-on: ubuntu-latest
    needs: [test, lint] # Only runs if tests and linting pass
    if: github.ref == 'refs/heads/master' # Only executes on master branch
    steps:
      - name: Grab the code
        uses: actions/checkout@v4 # Fetches the latest code from GitHub
      
      - name: Retrieve build cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: ${{ runner.os }}-build-

      - name: Zip Build 
        run: zip -r build.zip build 

      - name: Version Bump
        id: version
        uses: phips28/gh-action-bump-version@master
        with:
            tag-prefix: 'v'
            major-wording:  'MAJOR'
            minor-wording:  'minor'
            patch-wording:  'patch,fixes' 
            commit-message: 'CI: bump version to {{version}} [skip ci]'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build.zip
          tag_name: ${{ steps.version.outputs.newTag }}
          draft: false
          prerelease: false
          make_latest: true