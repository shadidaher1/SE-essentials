name: Dummy workflow

on:
  push:
    branches:
      - '**'
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Grab all the code
        uses: actions/checkout@v5
       
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Transpile TypeScript
        run: npm run build
      - name: Cache the built files
        uses: actions/cache@v5
        with:
          path: build
          key: ${{ runner.os }}-build-${{ github.sha }}
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Grab all the code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Cache the test results
        uses: actions/cache@v5
        with:
          path: coverage
          key: ${{ runner.os }}-test-${{ github.sha }}
  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Grab all the code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run linter
        run: npm run lint